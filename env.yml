# Conda environment for the native (server-mode) pipeline. Versions are pinned
# because usher, bte, and taxoniumtools produce the reference outputs the JS ports
# are tested byte-exact against; bumping a pin means regenerating the goldens under
# src/ui/ts/test and src/autolin/test.
name: taxalin
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - bte=0.9.3
  - usher=0.6.6
  - boost=1.85
  - pip:
      - pango_aliasor==0.3.0
      - taxoniumtools==2.1.24
