# Conda environment for Linolium's native (server-mode) pipeline.
#
# Versions are pinned for reproducibility. usher (matUtils / usher_to_taxonium),
# bte, and taxoniumtools produce the reference outputs that the browser-mode JS
# ports are verified byte-exact against (see src/ui/ts/test/conversion-parity.mjs);
# an unpinned solve could change those outputs and silently break that equivalence.
# When bumping a pin, regenerate the affected goldens and re-run the parity tests.
name: taxalin
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - bte=0.9.3
  - usher=0.6.6
  - boost=1.85
  - pip:
      - pango_aliasor==0.3.0
      - taxoniumtools==2.1.24
