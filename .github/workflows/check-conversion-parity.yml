name: JS tests

# Runs the pure-Node JS test suite (`npm test` in src/ui):
#   * conversion parity — the WASM build's JS ports (src/ui/ts/src/{matpb,matUtils,
#     usherToTaxonium}.js) checked byte-exact against native matUtils/usher_to_taxonium
#     output on a golden tree, so server and browser modes can't drift;
#   * lineage-edit engine — merge / edit-root / conflict-aware undo against the shared
#     src/ui/shared/lineageEditCore.cjs.
# The ports and engine have no npm deps, so no install step is needed.
on:
  pull_request:
    paths:
      - "src/ui/ts/**"
      - "src/ui/shared/**"
      - "src/autolin/XFG.pangoonly.pb"
      - ".github/workflows/check-conversion-parity.yml"
  push:
    branches: [main]

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm test (conversion parity + lineage-edit engine)
        working-directory: src/ui
        run: npm test
