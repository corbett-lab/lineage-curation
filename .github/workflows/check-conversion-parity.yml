name: JS tests

# Runs the pure-Node JS suite (`npm test` in src/ui): the conversion-parity test (JS
# ports in src/ui/ts/src checked byte-exact against native matUtils/usher_to_taxonium
# on a golden tree) and the lineage-edit engine test. No npm deps, so no install step.
on:
  pull_request:
    paths:
      - "src/ui/ts/**"
      - "src/ui/shared/**"
      - "src/autolin/XFG.pangoonly.pb"
      - ".github/workflows/check-conversion-parity.yml"
  push:
    branches: [main]

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm test (conversion parity + lineage-edit engine)
        working-directory: src/ui
        run: npm test
