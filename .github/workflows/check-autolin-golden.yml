name: autolin proposal golden

# Runs propose_sublineages.py on a golden tree and checks the proposed sublineages
# byte-exact against the committed golden. Needs the native env, so it runs the repo
# (mounted) in the published linolium image. That image is built from main, so an
# env.yml change is only validated once it merges and the image rebuilds.
on:
  pull_request:
    paths:
      - "src/autolin/**"
      - ".github/workflows/check-autolin-golden.yml"
  push:
    branches: [main]

jobs:
  autolin-golden:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: AutoLin proposal matches golden
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/${{ github.repository }}:latest \
            bash src/autolin/test/run-autolin-golden.sh
